    services:
      postgres:
        image: postgres:16-alpine
        container_name: skillmatch-postgres
        restart: unless-stopped
        environment:
          POSTGRES_DB: skillmatch
          POSTGRES_USER: skillmatch
          POSTGRES_PASSWORD: secret
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U skillmatch -d skillmatch"]
          interval: 5s
          timeout: 5s
          retries: 5
          start_period: 5s
        networks:
          - skillmatch-net

      redis:
        image: redis:7-alpine
        container_name: skillmatch-redis
        restart: unless-stopped
        ports:
          - "6379:6379"
        volumes:
          - redis_data:/data
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 5s
          retries: 5
        networks:
          - skillmatch-net

      qdrant:
        image: qdrant/qdrant:v1.13.0
        container_name: skillmatch-qdrant
        restart: unless-stopped
        ports:
          - "6333:6333"
          - "6334:6334"
        volumes:
          - qdrant_data:/qdrant/storage
        networks:
          - skillmatch-net

      backend:
        build:
          context: ./Backend
          dockerfile: Dockerfile
        container_name: skillmatch-backend
        restart: unless-stopped
        ports:
          - "8000:8000"
        environment:
          - APP_NAME=SkillMatch
          - APP_ENV=local
          - APP_DEBUG=true
          - APP_URL=http://localhost:8000
          - DB_CONNECTION=pgsql
          - DB_HOST=postgres
          - DB_PORT=5432
          - DB_DATABASE=skillmatch
          - DB_USERNAME=skillmatch
          - DB_PASSWORD=secret
          - REDIS_CLIENT=phpredis
          - REDIS_HOST=redis
          - REDIS_PORT=6379
          - CACHE_STORE=redis
          - QUEUE_CONNECTION=redis
          - SESSION_DRIVER=redis
        depends_on:
          postgres:
            condition: service_healthy
          redis:
            condition: service_healthy
        networks:
          - skillmatch-net

      ai:
        build:
          context: ./AI
          dockerfile: Dockerfile
        container_name: skillmatch-ai
        restart: unless-stopped
        ports:
          - "8001:8001"
        environment:
          - API_HOST=0.0.0.0
          - API_PORT=8001
          - ENVIRONMENT=development
          - REDIS_URL=redis://redis:6379/0
          - DATABASE_URL=postgresql+psycopg2://skillmatch:secret@postgres:5432/skillmatch
        depends_on:
          redis:
            condition: service_healthy
          qdrant:
            condition: service_started
        networks:
          - skillmatch-net

      frontend:
        build:
          context: ./Frontend
          dockerfile: Dockerfile
        container_name: skillmatch-frontend
        restart: unless-stopped
        ports:
          - "8080:8080"
        depends_on:
          - backend
        networks:
          - skillmatch-net

    volumes:
      postgres_data:
        driver: local
      redis_data:
        driver: local
      qdrant_data:
        driver: local

    networks:
      skillmatch-net:
        driver: bridge
                                    progress: 12.5
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Task not found (or not owned).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    $ref: '#/components/responses/ValidationError'

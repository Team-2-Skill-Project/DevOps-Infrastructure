paths:
    /api/auth/register:
        post:
            operationId: authRegister
            tags: [Authentication]
            summary: Register a new candidate account
            description: |-
                Public. Creates the user and sends a 6-digit email verification OTP.
                Requires `password_confirmation` matching `password`. Throttle: 10 requests/minute per IP.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                [name, email, password, password_confirmation]
                            properties:
                                name:
                                    type: string
                                    maxLength: 255
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                password:
                                    type: string
                                    minLength: 8
                                    description: Minimum 8 characters; this endpoint also requires password_confirmation to match.
                                password_confirmation:
                                    type: string
                        example:
                            name: Ahmed Wael
                            email: candidate@example.com
                            password: Secret123!
                            password_confirmation: Secret123!
            responses:
                '201':
                    description: Registered; verification OTP sent.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, email, user]
                                properties:
                                    message:
                                        type: string
                                    email:
                                        type: string
                                        format: email
                                    user:
                                        $ref: '#/components/schemas/User'
                            example:
                                message: Registration successful. A verification code has been sent to your email.
                                email: candidate@example.com
                                user:
                                    id: 1
                                    name: Ahmed Wael
                                    email: candidate@example.com
                                    role: candidate
                                    is_active: true
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '503':
                    description: Verification email could not be sent.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Unable to send the email verification code. Please try registering again shortly.
    /api/auth/login:
        post:
            operationId: authLogin
            tags: [Authentication]
            summary: Log in and get a JWT
            description: |-
                Public. Validates credentials with the `api` (JWT) guard. Email must
                already be verified. Throttle: 5 requests/minute (route middleware).
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
                        example:
                            email: candidate@example.com
                            password: Secret123!
            responses:
                '200':
                    description: Authenticated.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    [access_token, token_type, expires_in, user]
                                properties:
                                    access_token:
                                        type: string
                                        description: 'JWT. Send as Authorization: Bearer <token>.'
                                    token_type:
                                        type: string
                                        example: bearer
                                    expires_in:
                                        type: integer
                                        description: Seconds until expiry (default 3600).
                                    user:
                                        $ref: '#/components/schemas/User'
                            example:
                                access_token: PASTE_JWT_FROM_LOGIN_HERE
                                token_type: bearer
                                expires_in: 3600
                                user:
                                    id: 1
                                    name: Ahmed Wael
                                    email: candidate@example.com
                                    role: candidate
                                    is_active: true
                '401':
                    description: Invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Invalid credentials.
                '403':
                    description: Email address is not verified.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Email address is not verified.
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
    /api/auth/me:
        get:
            operationId: authMe
            tags: [Authentication]
            summary: Get the current authenticated user
            description: JWT only. No role check.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            responses:
                '200':
                    description: Current user.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [user]
                                properties:
                                    user:
                                        $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
    /api/auth/verify-email-otp:
        post:
            operationId: authVerifyEmailOtp
            tags: [Authentication]
            summary: Verify email with 6-digit OTP
            description: |-
                Public. OTP expires, allows max 5 wrong attempts (then 429 - request a
                new code). Throttle: 20/min per IP, 10/min per email.
                Development/testing environment may use the test verification code 123456.
                Production OTP codes are delivered through the configured email provider.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, otp]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                otp:
                                    type: string
                                    pattern: '^[0-9]{6}$'
                                    example: '482913'
                        example:
                            email: candidate@example.com
                            otp: '482913'
            responses:
                '200':
                    description: Email verified.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, user]
                                properties:
                                    message:
                                        type: string
                                    user:
                                        $ref: '#/components/schemas/User'
                            example:
                                message: Email verified successfully.
                                user:
                                    id: 1
                                    email: candidate@example.com
                                    role: candidate
                '422':
                    description: Invalid/expired code or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: The code is invalid or expired. Request a new code.
                                errors:
                                    otp:
                                        - The code is invalid or expired. Request a new code.
                '429':
                    $ref: '#/components/responses/TooManyRequests'
    /api/auth/resend-email-otp:
        post:
            operationId: authResendEmailOtp
            tags: [Authentication]
            summary: Resend the email verification OTP
            description: Public. Requires an existing unverified account. Throttle is 10/min per IP and 3/hour per email.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                        example:
                            email: candidate@example.com
            responses:
                '200':
                    description: New code sent.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: A new verification code has been sent to your email.
                '422':
                    description: No unverified account for this email (or validation failure).
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ErrorMessage'
                                    - $ref: '#/components/schemas/ValidationError'
                            example:
                                message: An unverified account is required.
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '503':
                    description: Email could not be sent.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Unable to send the email code. Please try again shortly.
    /api/auth/forgot-password:
        post:
            operationId: authForgotPassword
            tags: [Authentication]
            summary: Request a password reset OTP
            description: Public. Anti-spam allows max 1 request/minute per email (429 plus Retry-After 60). Throttle is 10/min per IP and 3/hour per email.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                        example:
                            email: candidate@example.com
            responses:
                '200':
                    description: Reset code sent.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: A password reset code has been sent to your email.
                '422':
                    description: Unknown email (anti-enumeration) or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: Unable to send a reset code. Check the email address and try again.
                                errors:
                                    email:
                                        - Unable to send a reset code. Check the email address and try again.
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '503':
                    description: Email could not be sent.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
    /api/auth/forgot-password/verify-otp:
        post:
            operationId: authVerifyPasswordResetOtp
            tags: [Authentication]
            summary: Verify password reset OTP, get reset token
            description: |-
                Public. Returns a 64-char reset_token valid 10 minutes (600s). Max 5
                wrong attempts. Response includes Cache-Control: no-store.
                Development/testing environment may use the test verification code 123456.
                Production OTP codes are delivered through the configured email provider.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, otp]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                otp:
                                    type: string
                                    pattern: '^[0-9]{6}$'
                        example:
                            email: candidate@example.com
                            otp: '482913'
            responses:
                '200':
                    description: Code verified.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, reset_token, expires_in]
                                properties:
                                    message:
                                        type: string
                                    reset_token:
                                        type: string
                                        minLength: 64
                                        maxLength: 64
                                    expires_in:
                                        type: integer
                                        example: 600
                            example:
                                message: Code verified. You may now reset your password.
                                reset_token: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
                                expires_in: 600
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
    /api/auth/reset-password:
        post:
            operationId: authResetPassword
            tags: [Authentication]
            summary: Reset password with reset token
            description: Public. `reset_token` from the verify-otp step. Requires matching `password_confirmation`.
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                [
                                    email,
                                    reset_token,
                                    password,
                                    password_confirmation,
                                ]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                reset_token:
                                    type: string
                                    minLength: 64
                                    maxLength: 64
                                password:
                                    type: string
                                    description: Dev/staging only `required|string|confirmed`; production enforces min 12 with mixed case, letters, numbers, symbols.
                                password_confirmation:
                                    type: string
                        example:
                            email: candidate@example.com
                            reset_token: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
                            password: NewSecret123!
                            password_confirmation: NewSecret123!
            responses:
                '200':
                    description: Password reset; log in again.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Password reset successfully. Please log in.
                '422':
                    description: Invalid/expired reset session or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: The password reset session is invalid or expired. Request a new code.
                                errors:
                                    reset_token:
                                        - The password reset session is invalid or expired. Request a new code.
                '429':
                    $ref: '#/components/responses/TooManyRequests'

                        schema:
                            type: object
                            properties:
                                evidence:
                                    type: string
                                    maxLength: 5000
                                    nullable: true
                                notes:
                                    type: string
                                    maxLength: 5000
                                    nullable: true
                        example:
                            evidence: https://github.com/example/project
                            notes: Finished the REST module.
            responses:
                '200':
                    description: Task completed; full roadmap returned.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessEnvelope'
                            example:
                                status: success
                                message: Roadmap task completed.
                                data:
                                    id: 1

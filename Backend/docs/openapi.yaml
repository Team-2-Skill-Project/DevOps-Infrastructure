            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [company_id, title, description]
                            properties:
                                company_id:
                                    type: integer
                                title:
                                    type: string
                                    maxLength: 255
                                description:
                                    type: string
                                job_type:
                                    $ref: '#/components/schemas/JobType'
                                employment_type:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                work_mode:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                experience_level:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                country:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                state:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                city:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                min_years_experience:
                                    type: integer
                                    minimum: 0
                                    nullable: true
                                max_years_experience:
                                    type: integer
                                    minimum: 0
                                    nullable: true
                                responsibilities:
                                    type: array
                                    nullable: true
                                    items:
                                        type: string
                                canonical_role:
                                    type: string
                                    maxLength: 150
                                    nullable: true
                                salary_min:
                                    type: number
                                    minimum: 0
                                    nullable: true
                                salary_max:
                                    type: number
                                    minimum: 0
                                    nullable: true
                                salary_currency:
                                    type: string
                                    minLength: 3
                                    maxLength: 3
                                    nullable: true
                                    example: EGP
                                published_at:
                                    type: string
                                    format: date-time
                                    nullable: true
                                expires_at:
                                    type: string
                                    format: date-time
                                    nullable: true
                                is_active:
                                    type: boolean
                                application_method:
                                    $ref: '#/components/schemas/ApplicationMethod'
                                application_url:
                                    type: string
                                    format: uri
                                    maxLength: 2048
                                    nullable: true
                                required_skills:
                                    type: array
                                    items:
                                        type: object
                                        required: [skill_id]
                                        properties:
                                            skill_id:
                                                type: integer
                                            importance:
                                                type: integer
                                                minimum: 1
                                                maximum: 5
                                                nullable: true
                                            required_level:
                                                type: string
                                                maxLength: 50
                                                nullable: true
                                preferred_skills:
                                    type: array
                                    items:
                                        type: object
                                        required: [skill_id]
                                        properties:
                                            skill_id:
                                                type: integer
                                            importance:
                                                type: integer
                                                minimum: 1
                                                maximum: 5
                                                nullable: true
                                            required_level:
                                                type: string
                                                maxLength: 50
                                                nullable: true
                        example:
                            company_id: 1
                            title: Backend Developer
                            description: Build and maintain APIs.
                            job_type: job
                            employment_type: full_time
                            work_mode: remote
                            country: Egypt

            tags: [Admin - Jobs]
            summary: Create a job post
            description: |-
                JWT + active admin. `company_id` (existing active company), `title`
                and `description` required. Cross-field rules: `max_years_experience`
                >= `min_years_experience`; `expires_at` after `published_at` and not
                in the past; `external` requires `application_url`, `internal`
                forbids it; skill IDs must exist with no duplicates within/across groups.

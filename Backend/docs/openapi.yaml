    /api/admin/ai-review-items/{aiReviewItem}/correct:
        post:
            operationId: adminAiReviewCorrect
            tags: [Admin - AI Review]
            summary: Correct an AI proposal with edited payload
            description: JWT + active admin. `corrected_value` and `decision_reason` are required; `corrected_value` may contain either or both of the optional `skills` and `experiences` lists. Only `pending` items can be decided.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: aiReviewItem
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [corrected_value, decision_reason]
                            properties:
                                corrected_value:
                                    type: object
                                    properties:
                                        skills:
                                            type: array
                                            maxItems: 100
                                            items:
                                                type: object
                                                required: [name]
                                                properties:
                                                    name:
                                                        type: string
                                                        maxLength: 255
                                                    category:
                                                        type: string
                                                        maxLength: 255
                                                        nullable: true
                                                    proficiency_level:
                                                        type: string
                                                        maxLength: 100
                                                        nullable: true
                                                    confidence_score:
                                                        type: number
                                                        minimum: 0
                                                        maximum: 1
                                                        nullable: true
                                                    evidence:
                                                        type: array
                                                        maxItems: 20
                                                        nullable: true
                                                        items: {}
                                        experiences:
                                            type: array
                                            maxItems: 100
                                            items:
                                                type: object
                                                required: [company_name, title]
                                                properties:
                                                    company_name:
                                                        type: string
                                                        maxLength: 255
                                                    title:
                                                        type: string
                                                        maxLength: 255
                                                    start_date:
                                                        type: string
                                                        format: date
                                                        nullable: true
                                                    end_date:
                                                        type: string
                                                        format: date
                                                        nullable: true
                                                    description:
                                                        type: string
                                                        maxLength: 5000
                                                        nullable: true
                                                    employment_type:
                                                        type: string
                                                        maxLength: 100
                                                        nullable: true
                                                    country:
                                                        type: string
                                                        maxLength: 100
                                                        nullable: true
                                                    city:
                                                        type: string
                                                        maxLength: 100
                                                        nullable: true
                                                    is_current:
                                                        type: boolean
                                                    technologies:
                                                        type: array
                                                        maxItems: 100
                                                        nullable: true
                                                        items:
                                                            type: string
                                                            maxLength: 255
                                decision_reason:
                                    type: string
                                    maxLength: 1000
                                reviewer_notes:
                                    type: string
                                    maxLength: 2000
                                    nullable: true
                        example:
                            corrected_value:
                                skills:
                                    - name: Laravel
                                      category: Backend
                                      proficiency_level: advanced
                                      confidence_score: 0.9
                                experiences:
                                    - company_name: Acme
                                      title: Backend Developer
                                      start_date: '2022-01-01'
                            decision_reason: Fixed skill level and company name.
            responses:
                '200':
                    description: Decided item (with audits).
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AiReviewItem'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Review item not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    $ref: '#/components/responses/ValidationError'

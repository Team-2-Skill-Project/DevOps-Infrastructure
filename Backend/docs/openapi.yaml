                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                decision_reason:
                                    type: string
                                    maxLength: 1000
                                    nullable: true
                                reviewer_notes:
                                    type: string
                                    maxLength: 2000
                                    nullable: true
                        example:
                            decision_reason: Proposal matches the CV data.
            responses:
                '200':
                    description: Decided item (with audits).
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AiReviewItem'

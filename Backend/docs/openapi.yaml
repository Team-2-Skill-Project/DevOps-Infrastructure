                - name: application_method
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/ApplicationMethod'
                - name: is_verified_company
                  in: query
                  required: false
                  schema:
                      type: boolean
                - name: required_skill_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: integer
                - name: preferred_skill_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: integer
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PerPage'

    /api/cv/extractions/{extraction}/verify:
        post:
            operationId: cvExtractionVerify
            tags: [CV Processing]
            summary: Verify (correct) an AI extraction
            description: JWT. Owner of the parent CV document only. Syncs verified skills and creates experiences; returns data null on success.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: extraction
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                skills:
                                    type: array
                                    nullable: true
                                    items:
                                        type: object
                                        required: [name]
                                        properties:
                                            name:
                                                type: string
                                                maxLength: 255
                                            category:
                                                type: string
                                                maxLength: 255
                                                nullable: true
                                            proficiency_level:
                                                type: string
                                                nullable: true
                                            confidence_score:
                                                type: number
                                                minimum: 0
                                                maximum: 1
                                                nullable: true
                                experiences:
                                    type: array
                                    nullable: true
                                    items:
                                        type: object
                                        required:
                                            [company_name, title, start_date]
                                        properties:
                                            company_name:
                                                type: string
                                                maxLength: 255
                                            title:
                                                type: string
                                                maxLength: 255
                                            start_date:
                                                type: string
                                                format: date
                                            end_date:
                                                type: string
                                                format: date
                                                nullable: true
                                                description: Must be on or after the corresponding start_date.
                                            description:
                                                type: string
                                                nullable: true
                        example:
                            skills:
                                - name: Laravel
                                  category: Backend
                                  proficiency_level: advanced
                                  confidence_score: 0.95
                            experiences:
                                - company_name: Acme
                                  title: Backend Developer
                                  start_date: '2022-01-01'
                                  end_date: '2024-01-01'
                                  description: Built APIs.
            responses:
                '200':
                    description: Verified with data null.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessEnvelope'
                            example:
                                status: success
                                message: CV extraction verified.
                                data: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Not the owner.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Extraction not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    $ref: '#/components/responses/ValidationError'

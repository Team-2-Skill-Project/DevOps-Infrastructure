openapi: 3.1.0
info:
    title: SkillMatch API
    version: 1.1.0
    description: |-
        SkillMatch backend API (Laravel, JWT via `auth:api` guard).

        ## Authentication
        Most endpoints require a JWT Bearer token. Log in via
        `POST /api/auth/login`, then send `Authorization: Bearer <access_token>`
        (use **Authorize** in Swagger UI). Tokens expire after `expires_in`
        seconds (default 3600). Public endpoints (register, login, OTP,
        password reset) must NOT send a token.

        ## Localization
        Every endpoint accepts an optional `Accept-Language` header.
        Supported: `en`, `en-US`, `ar`, `ar-EG`. Regional variants are
        normalized (`en-US` -> `en`, `ar-EG` -> `ar`); anything else falls
        back to English. Localization affects human-readable `message`
        strings ONLY. JSON keys, IDs, enum machine values, status machine
        values, timestamps and numbers never change.

        ## Conventions
        * Timestamps are ISO-8601 strings, dates are `YYYY-MM-DD`.
        * Validation failures use the Laravel shape
          `{"message": "...", "errors": {"field": ["..."]}}`.
          Some domain-level `422` responses intentionally contain only
          `{"message": "..."}`; each operation documents the applicable shape.
        * Unless stated otherwise, paginated responses use the Laravel shape
          `{"data": [...], "links": {...}, "meta": {...}}` with `per_page`
          default `15` (max `100`).
    contact:
        name: SkillMatch Backend
servers:
    - url: https://skillmatch.iptvdemo.serv5group.com
      description: Production / test deployment
    - url: http://localhost:8000
      description: Local development
tags:
    - name: Authentication
      description: Register, login, email OTP verification, password reset.
    - name: Candidate Profile
      description: Candidate profile and career preferences.
    - name: Candidate Educations
      description: Candidate education history.
    - name: Candidate Experiences
      description: Candidate work experience.
    - name: Candidate Projects
      description: Candidate projects.
    - name: Candidate Skills
      description: Skills attached to the candidate profile.
    - name: Skills
      description: Global skill taxonomy search.
    - name: Jobs
      description: Public job feed for authenticated users.
    - name: Saved Jobs
      description: Save / unsave jobs and list saved jobs.
    - name: Applications
      description: Job applications (candidate + status tracking).
    - name: CV Processing
      description: CV upload, processing status, history and extraction verification.
    - name: Notifications
      description: Candidate notifications.
    - name: Roadmaps
      description: AI career roadmaps, refresh and task completion.
    - name: Admin - Companies
      description: Company management and merging (admin only).
    - name: Admin - Jobs
      description: Job post management (admin only).
    - name: Admin - Job Sources
      description: Job source management (admin only).
    - name: Admin - Raw Jobs
      description: Ingested raw job payloads (admin only).
    - name: Admin - Ingestion Runs
      description: Job source ingestion runs (admin only).
    - name: Admin - Skills
      description: Skill taxonomy, aliases and merging (admin only).
    - name: Admin - AI Review
      description: AI review queue and decisions (admin only).
    - name: Admin - Audit Logs
      description: Cross-domain audit log query (admin only).
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT access token from POST /api/auth/login.
    parameters:
        AcceptLanguage:
            name: Accept-Language
            in: header
            required: false
            description: Response message locale. `en-US` -> `en`, `ar-EG` -> `ar`; anything else falls back to English. Affects human-readable messages only.
            schema:
                type: string
                enum: [en, en-US, ar, ar-EG]
                default: en
        Page:
            name: page
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                default: 1
        PerPage:
            name: per_page
            in: query
            required: false
            description: Items per page (max 100).
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 15
    responses:
        Unauthorized:
            description: Missing or invalid JWT.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
                    example:
                        message: Unauthenticated.
        Forbidden:
            description: Authenticated but not allowed (inactive account or wrong role).
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
                    examples:
                        inactive:
                            value:
                                message: Your account is inactive.
                        role:
                            value:
                                message: Only candidates can access this profile.
        NotFound:
            description: Resource not found (message is localized).
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
                    example:
                        message: Candidate profile not found.
        ValidationError:
            description: Laravel validation failure.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationError'
                    example:
                        message: The email field is required. (and 1 more error)
                        errors:
                            email:
                                - The email field is required.
        TooManyRequests:
            description: Rate limit exceeded (throttle middleware or OTP attempt limit).
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
                    example:
                        message: Too many invalid attempts. Request a new code.
        BadGateway:
            description: The roadmap generator returned output that failed backend validation.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
                    example:
                        message: The generated roadmap could not be validated. Please try again.
        ServerError:
            description: Unexpected server error.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorMessage'
    schemas:
        ErrorMessage:
            type: object
            required: [message]
            properties:
                message:
                    type: string
                    example: Unauthenticated.
        ValidationError:
            type: object
            required: [message, errors]
            properties:
                message:
                    type: string
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
        PaginationLinks:
            type: object
            properties:
                first:
                    type: string
                    nullable: true
                last:
                    type: string
                    nullable: true
                prev:
                    type: string
                    nullable: true
                next:
                    type: string
                    nullable: true
        PaginationMeta:
            type: object
            properties:
                current_page:
                    type: integer
                from:
                    type: integer
                    nullable: true
                last_page:
                    type: integer
                per_page:
                    type: integer
                to:
                    type: integer
                    nullable: true
                total:
                    type: integer
        ApiSuccessEnvelope:
            type: object
            description: Success envelope used by plain API responses and by JSON:API resources that add top-level status/message fields.
            required: [status, message, data]
            properties:
                status:
                    type: string
                    enum: [success]
                message:
                    type: string
                    nullable: true
                data:
                    description: Endpoint-specific payload (object, array or null).
        ApiErrorEnvelope:
            type: object
            required: [status, message]
            properties:
                status:
                    type: string
                    enum: [error]
                message:
                    type: string
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
        ApplicationStatus:
            type: string
            enum: [applied, in_review, interview, rejected, offer, withdrawn]
            description: Machine value. Flutter must rely on this, not on translated messages.
        RoadmapStatus:
            type: string
            enum: [active, completed, archived]
        RoadmapTaskStatus:
            type: string
            enum: [pending, in_progress, completed]
        AiReviewStatus:
            type: string
            enum: [pending, approved, corrected, rejected]
        AiReviewAction:
            type: string
            enum: [approved, corrected, rejected]
        AiReviewEntityType:
            type: string
            enum: [cv_extraction]
        AiReviewOperation:
            type: string
            enum: [cv_profile_sync]
        AiReviewTriggerReason:
            type: string
            enum: [low_confidence]
        CvParsingStatus:
            type: string
            enum: [uploaded, processing, completed, failed]
        CvExtractionStatus:
            type: string
            enum: [pending, processing, SUCCESS, failed]
            description: NOTE `SUCCESS` is uppercase in the backend.
        JobType:
            type: string
            enum: [job, internship]
        ApplicationMethod:
            type: string
            enum: [internal, external]
        JobSourceType:
            type: string
            enum: [public, authorized, manual]
        JobCollectionMethod:
            type: string
            enum: [api, scraper, manual, file]
        RawJobExtractionStatus:
            type: string
            enum: [pending, extracted, failed]
        RawJobDeduplicationStatus:
            type: string
            enum: [pending, matched, possible, distinct, failed]
        RawJobNormalizationStatus:
            type: string
            enum: [pending, normalized, failed]
        RawJobDeduplicationMethod:
            type: string
            enum:
                [
                    existing_reference,
                    same_source_external_id,
                    exact_normalized_url,
                    fingerprint_candidate,
                    title_company_similarity,
                    no_match,
                ]
        IngestionRunStatus:
            type: string
            enum: [running, succeeded, partial, failed]
        IngestionRunTrigger:
            type: string
            enum: [scheduled, manual, retry]
        User:

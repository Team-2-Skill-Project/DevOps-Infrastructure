                                $ref: '#/components/schemas/ErrorMessage'
    /api/roadmaps/{roadmap}/refresh:
        post:
            operationId: roadmapRefresh
            tags: [Roadmaps]
            summary: Refresh a roadmap
            description: |-
                JWT + active candidate. Empty body runs the auto-check (refreshes only
                when needed). Optional new target overrides the check. Throttle:
                5 requests/minute. `meta.refreshed` tells whether a new version was
                generated.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: roadmap
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                target_type:
                                    type: string
                                    enum: [role, job]
                                target_role:
                                    type: string
                                    maxLength: 150
                                    description: Required when target_type=role; forbidden otherwise.
                                target_job_id:
                                    type: integer
                                    description: Required when target_type=job; forbidden otherwise.
                        example:
                            target_type: role
                            target_role: Staff Backend Engineer
            responses:
                '200':
                    description: Roadmap with refresh meta.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [status, message, meta, data]
                                properties:
                                    status:
                                        type: string
                                        example: success
                                    message:
                                        type: string
                                    meta:
                                        type: object
                                        required: [refreshed, reasons]
                                        properties:
                                            refreshed:
                                                type: boolean
                                            reasons:
                                                type: array
                                                items:
                                                    type: string
                                    data:
                                        $ref: '#/components/schemas/Roadmap'
                            example:
                                status: success
                                message: Roadmap refreshed.
                                meta:
                                    refreshed: true
                                    reasons:
                                        - target_changed
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Roadmap not found (or not owned).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '502':
                    $ref: '#/components/responses/BadGateway'
    /api/roadmap-tasks/{roadmapTask}/complete:

                - name: work_mode
                  in: query
                  required: false
                  schema:
                      type: string
                - name: employment_type
                  in: query
                  required: false
                  schema:
                      type: string
                - name: experience_level
                  in: query
                  required: false
                  schema:
                      type: string
                - name: country
                  in: query
                  required: false
                  schema:
                      type: string
                - name: state
                  in: query
                  required: false
                  schema:
                      type: string
                - name: city
                  in: query
                  required: false
                  schema:
                      type: string
                - name: source
                  in: query
                  required: false
                  schema:

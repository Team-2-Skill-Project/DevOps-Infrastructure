            summary: Complete a roadmap task
            description: JWT + active candidate. Only `evidence` and `notes` are accepted (`progress`, `status`, `completed_at` are rejected with 422). Idempotent; completing tasks recalculates progress and may flip the roadmap `active` <-> `completed`. Returns the full roadmap.

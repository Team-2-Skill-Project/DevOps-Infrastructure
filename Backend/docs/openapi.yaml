    /api/roadmaps:
        post:
            operationId: roadmapStore
            tags: [Roadmaps]
            summary: Generate a career roadmap
            description: |-
                JWT + active candidate. Requires a candidate profile (404 otherwise).
                Either a free-text role or an existing job as target (exactly one).
                Throttle: 5 requests/minute. Returns the full roadmap hierarchy.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [target_type]
                            properties:
                                target_type:
                                    type: string
                                    enum: [role, job]
                                target_role:
                                    type: string
                                    maxLength: 150
                                    description: Required when target_type=role; forbidden otherwise.
                                target_job_id:
                                    type: integer
                                    description: Required when target_type=job; forbidden otherwise. Must be an available job.
                        example:
                            target_type: role
                            target_role: Senior Backend Developer
            responses:
                '201':
                    description: Generated with success envelope containing the roadmap.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccessEnvelope'
                            example:
                                status: success
                                message: Roadmap generated successfully.
                                data:
                                    id: 1
                                    title: Path to Senior Backend Developer
                                    status: active
                                    progress: 0
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Candidate profile not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    description: Unavailable target job or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: The selected target job is unavailable.
                                errors:
                                    target_job_id:
                                        - The selected target job is unavailable.
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '502':
                    $ref: '#/components/responses/BadGateway'

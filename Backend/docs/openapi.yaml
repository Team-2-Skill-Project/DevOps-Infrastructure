                                data:
                                    id: 1
                                    entity_type: cv_extraction
                                    operation: cv_profile_sync
                                    trigger_reason: low_confidence
                                    status: approved
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Review item not found.

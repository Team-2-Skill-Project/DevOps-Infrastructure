            properties:
                id:
                    type: integer
                name:
                    type: string
                email:
                    type: string
                    format: email
                phone:
                    type: string
                    nullable: true
                avatar:
                    type: string
                    nullable: true
                email_verified_at:
                    type: string
                    format: date-time
                    nullable: true
                role:
                    type: string
                    example: candidate
                is_active:
                    type: boolean
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        UserResource:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                email:
                    type: string
                    format: email
                phone:
                    type: string
                    nullable: true
                avatar:
                    type: string
                    nullable: true
                email_verified_at:
                    type: string
                    format: date-time
                    nullable: true
                role:
                    type: string
                is_active:

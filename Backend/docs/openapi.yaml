    /api/candidate/skills:
        get:
            operationId: candidateSkillList
            tags: [Candidate Skills]
            summary: List candidate skills
            description: JWT + active candidate. Ordered newest first with the global skill loaded. Not paginated.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            responses:
                '200':
                    description: Skill list.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/CandidateSkill'
                            example:
                                data:
                                    - id: 5
                                      skill_id: 12
                                      source: manual
                                      proficiency_level: intermediate
                                      skill:
                                          id: 12
                                          name: Laravel
                                          normalized_name: laravel
                                          category: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Candidate profile not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
        post:
            operationId: candidateSkillAttach
            tags: [Candidate Skills]
            summary: Attach a skill to the profile
            description: JWT + active candidate. Creates the global skill if it does not exist (matched by lower-cased name). Attaching the same skill twice returns 422.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name:
                                    type: string
                                    maxLength: 255
                                    description: Trimmed; matched case-insensitively.
                                proficiency_level:
                                    type: string
                                    maxLength: 255
                                    nullable: true
                                    description: Free-form string, no enum.
                        example:
                            name: Laravel
                            proficiency_level: intermediate
            responses:
                '201':
                    description: Attached.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        $ref: '#/components/schemas/CandidateSkill'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Candidate profile not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    description: Already attached or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: This skill is already attached to your profile.
                                errors:
                                    name:
                                        - This skill is already attached to your profile.
    /api/candidate/skills/{candidateSkill}:
        delete:
            operationId: candidateSkillDetach

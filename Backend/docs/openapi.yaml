    /api/admin/ai-review-items/{aiReviewItem}/approve:
        post:
            operationId: adminAiReviewApprove
            tags: [Admin - AI Review]
            summary: Approve an AI proposal
            description: JWT + active admin. Only `pending` items can be decided (else 422). Optional reason/notes.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: aiReviewItem

                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
    /api/jobs/{jobPost}/save:
        post:
            operationId: savedJobStore
            tags: [Saved Jobs]
            summary: Save a job
            description: JWT plus active candidate. Idempotent - saving twice returns 200 with the same body (first save returns 201).
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: jobPost
                  in: path
                  required: true
                  description: Job post ID.
                  schema:
                      type: integer
            responses:
                '201':
                    description: Job saved.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, data]
                                properties:
                                    message:
                                        type: string
                                    data:
                                        type: object
                                        required: [job_id, is_saved]
                                        properties:
                                            job_id:
                                                type: integer
                                            is_saved:
                                                type: boolean
                                                example: true
                            example:
                                message: Job saved successfully.
                                data:
                                    job_id: 7
                                    is_saved: true
                '200':
                    description: Already saved (same body).
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, data]
                                properties:
                                    message:
                                        type: string
                                    data:
                                        type: object
                                        required: [job_id, is_saved]
                                        properties:
                                            job_id:
                                                type: integer
                                            is_saved:
                                                type: boolean
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Job not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                            example:
                                message: Job not found.
        delete:
            operationId: savedJobDestroy
            tags: [Saved Jobs]
            summary: Unsave a job
            description: JWT + active candidate. Unsaving a job that was not saved still returns 200.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: jobPost
                  in: path
                  required: true
                  description: Job post ID.
                  schema:
                      type: integer
            responses:
                '200':
                    description: Removed from saved jobs.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, data]
                                properties:
                                    message:
                                        type: string
                                    data:
                                        type: object
                                        required: [job_id, is_saved]
                                        properties:
                                            job_id:
                                                type: integer
                                            is_saved:
                                                type: boolean
                                                example: false
                            example:
                                message: Job removed from saved jobs.
                                data:
                                    job_id: 7
                                    is_saved: false
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Job not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
    /api/saved-jobs:
        get:
            operationId: savedJobList
            tags: [Saved Jobs]
            summary: List saved jobs
            description: JWT + active candidate. Ordered by save time desc. Paginated job-feed items (`is_saved` always true).
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PerPage'
            responses:
                '200':
                    description: Paginated saved jobs.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, links, meta]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/JobFeedItem'
                                    links:
                                        $ref: '#/components/schemas/PaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
    /api/applications:
        get:
            operationId: applicationList
            tags: [Applications]
            summary: List my applications
            description: |-
                JWT (any role). Candidates see only their own applications.
                Optional unvalidated filters `status` (exact database value) and
                `search` (job title substring). Fixed page size 10. JSON:API
                collection (`data/links/meta`).
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: status
                  in: query
                  required: false
                  schema:
                      type: string
                      description: Unvalidated exact database filter; normally use an ApplicationStatus value.
                - name: search
                  in: query
                  required: false
                  schema:
                      type: string
            responses:
                '200':
                    description: Application collection (JSON:API).
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/ApplicationCollectionResponse'
                            example:
                                data:
                                    - id: '1'
                                      type: applications
                                      attributes:
                                          status: applied
                                          cover_letter: I am excited to apply.
                                          applied_at: '2026-09-01T10:00:00Z'
                '401':
                    $ref: '#/components/responses/Unauthorized'
        post:
            operationId: applicationStore
            tags: [Applications]
            summary: Apply to a job
            description: JWT. Requires a candidate profile (else 403). One application per job per profile (duplicate returns 422). New applications start with status `applied`.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [job_id]
                            properties:
                                job_id:
                                    type: integer
                                    description: Must exist in job_posts; unique per candidate profile.
                                cover_letter:
                                    type: string
                                    maxLength: 2000
                                    nullable: true
                        example:
                            job_id: 7
                            cover_letter: I am excited to apply for this role.
            responses:
                '201':
                    description: Application submitted with success envelope.
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/ApplicationSuccessResponse'
                            example:
                                status: success
                                message: Application submitted successfully.
                                data:
                                    id: '1'
                                    type: applications
                                    attributes:
                                        status: applied
                                        cover_letter: I am excited to apply for this role.
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Candidate profile required.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorEnvelope'
                '422':
                    description: Already applied / unknown job / validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: You have already applied to this job.
                                errors:
                                    job_id:
                                        - You have already applied to this job.
    /api/applications/{application}:
        get:
            operationId: applicationShow
            tags: [Applications]
            summary: Get one application
            description: JWT. Loads job company, status history and candidate user. Candidates can only view their own applications (else 403).
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: application
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Application (JSON:API resource).
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/ApplicationResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Application not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
    /api/applications/{application}/status:
        patch:
            operationId: applicationUpdateStatus
            tags: [Applications]
            summary: Change application status
            description: |-
                JWT. Candidate users can only touch their own applications (else 403);
                non-candidate users are not ownership-scoped by the current controller.
                Allowed transitions: `applied` -> `in_review, withdrawn, rejected`;
                `in_review` -> `interview, rejected, offer, withdrawn`;
                `interview` -> `offer, rejected, withdrawn`; `offer` -> `withdrawn`.
                Anything else returns 422.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: application
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [status]
                            properties:
                                status:
                                    $ref: '#/components/schemas/ApplicationStatus'
                                notes:
                                    type: string
                                    maxLength: 500
                                    nullable: true
                        example:
                            status: in_review
                            notes: Moving to review.
            responses:
                '200':
                    description: Status updated with success envelope.
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/ApplicationSuccessResponse'
                            example:
                                status: success
                                message: Application status updated successfully.
                                data:
                                    id: '1'
                                    type: applications
                                    attributes:
                                        status: in_review
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Not the owner.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorEnvelope'
                '404':
                    description: Application not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    description: Illegal transition or validation failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                            example:
                                message: Invalid status transition.
                                errors:
                                    status:
                                        - Invalid status transition.
    /api/applications/{application}/withdraw:
        post:
            operationId: applicationWithdraw
            tags: [Applications]
            summary: Withdraw an application
            description: JWT. Owner only (403 otherwise). Fails with 422 when the application is already `rejected` or `withdrawn`. No request body.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: application
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Withdrawn with success envelope.
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/ApplicationSuccessResponse'
                            example:
                                status: success
                                message: Application withdrawn successfully.
                                data:
                                    id: '1'
                                    type: applications
                                    attributes:
                                        status: withdrawn
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Not the owner.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorEnvelope'
                '404':
                    description: Application not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    description: Cannot withdraw from the current status.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
    /api/cv/upload:
        post:
            operationId: cvUpload
            tags: [CV Processing]
            summary: Upload (or replace) the candidate CV
            description: |-
                JWT (any role with a candidate profile, else 404).
                `multipart/form-data` with field `cv`: PDF or DOCX, max 5 MB,
                non-empty. Each upload bumps `version`, unsets the previous
                current document and returns the new document with status `uploaded`.
                Processing is not performed by this request.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [cv]
                            properties:
                                cv:
                                    type: string
                                    format: binary
                                    description: PDF or DOCX file, max 5 MB (5120 KB), must not be empty.
            responses:
                '201':
                    description: Uploaded with success envelope containing the CV document.
                    content:
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/JsonApiCvDocumentSuccessResponse'

    /api/admin/skills/{sourceSkill}/merge:
        post:
            operationId: adminSkillMerge
            tags: [Admin - Skills]
            summary: Merge a duplicate skill into a target
            description: JWT + active admin. Moves candidate/job links and aliases to the target; `target_skill_id` must differ from the source.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: sourceSkill
                  in: path
                  required: true
                  description: Skill to merge away.
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [target_skill_id]
                            properties:
                                target_skill_id:
                                    type: integer
                        example:
                            target_skill_id: 12
            responses:
                '200':
                    description: Target skill plus merge counters.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, meta]
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Skill'
                                    meta:
                                        type: object
                                        properties:
                                            merged_skill_id:
                                                type: integer
                                            target_skill_id:
                                                type: integer
                                            candidate_skill_links_moved:
                                                type: integer
                                            candidate_skill_links_consolidated:
                                                type: integer
                                            job_skill_links_moved:
                                                type: integer
                                            job_skill_links_consolidated:
                                                type: integer
                                            aliases_moved:
                                                type: integer
                                            aliases_collapsed:
                                                type: integer
                                            source_name_aliases_created:
                                                type: integer
                                            roadmap_step_references_moved:
                                                type: integer
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Source or target skill not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '422':
                    $ref: '#/components/responses/ValidationError'
    /api/admin/audit-logs:
        get:
            operationId: adminAuditLogList
            tags: [Admin - Audit Logs]
            summary: Query cross-domain audit logs
            description: JWT plus active admin. Newest first (created_at desc, id desc). Paginated. Search matches action, entity_type and source only.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/AcceptLanguage'
                - name: actor_id
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                - name: action
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/AuditAction'
                - name: entity_type
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/AuditEntityType'
                - name: entity_id
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                - name: source
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/AuditSource'
                - name: date_from
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date
                - name: date_to
                  in: query
                  required: false
                  description: Must be on or after date_from.
                  schema:
                      type: string
                      format: date
                - name: search
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 100
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PerPage'
            responses:
                '200':
                    description: Paginated audit logs.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, links, meta]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/AuditLog'
                                    links:
                                        $ref: '#/components/schemas/PaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                            example:
                                data:
                                    - id: 1001
                                      actor_id: 12
                                      actor:
                                          id: 12
                                          name: Admin User
                                      action: application_status_changed
                                      entity_type: application
                                      entity_id: 123
                                      source: admin
                                      before:
                                          status: applied
                                      after:
                                          status: interview
                                      metadata: {}
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
    /api/admin/ai-review-items:
        get:
            operationId: adminAiReviewList
            tags: [Admin - AI Review]
            summary: List AI review queue items

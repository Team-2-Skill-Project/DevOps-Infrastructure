                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/AiReviewEntityType'
                - name: reason
                  in: query
                  required: false
                  description: Trigger reason filter (maps to trigger_reason).
                  schema:
                      $ref: '#/components/schemas/AiReviewTriggerReason'
                - name: source
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 191
                - name: reviewer_id
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                - name: confidence_min
                  in: query
                  required: false
                  schema:
                      type: number
                      minimum: 0
                      maximum: 1
                - name: confidence_max
                  in: query
                  required: false
                  schema:
                      type: number
                      minimum: 0
                      maximum: 1
                - name: created_from
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date
                - name: created_to
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date
                - name: search
                  in: query
                  required: false
                  description: Matches source text (or entity ID when numeric).
                  schema:
                      type: string
                      maxLength: 100
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PerPage'
            responses:
                '200':
                    description: Paginated review items (with reviewer, without audits).
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, links, meta]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/AiReviewItem'
                                    links:
                                        $ref: '#/components/schemas/PaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'

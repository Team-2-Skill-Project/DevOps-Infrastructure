services:
  prometheus: 
    image: prom/prometheus:v2.51.0
    container_name: skillmatch-prometheus
    restart: unless-stopped 
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro 
      - prometheus_data:/prometheus
    networks:
      - skillmatch-net 

  grafana: 
    image: grafana/grafana:10.4.1 
    container_name: skillmatch-grafana
    restart: unless-stopped 
    environment: 
      - GF_SECURITY_ADMIN_USER=admin 
      - GF_SECURITY_ADMIN_PASSWORD=skillmatch 
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro 
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro 
      - grafana_data:/var/lib/grafana 
    depends_on:
      - prometheus
    networks: 
    - skillmatch-net 
  
  cadvisor: 
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: skillmatch-cadvisor
    restart: unless-stopped
    privileged: true 
    devices: 
      - /dev/kmsg 
    volumes: 
      - /:/rootfs:ro 
      - /var/run:/var/run:ro 
      - /sys:/sys:ro 
      - /var/lib/docker/:/var/lib/docker:ro 
      - /dev/disk/:/dev/disk:ro 
    ports: 
      - "8085:8080" 
    networks: 
      - skillmatch-net 
    
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: skillmatch-node-exporter
    restart: unless-stopped 
    pid: host 
    command: 
      - '--path.rootfs=/host'
    volumes: 
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"
    networks: 
      - skillmatch-net

volumes:
  prometheus_data: 
    driver: local 
  grafana_data: 
    driver: local 

networks:
  skillmatch-net: 
    external: true 


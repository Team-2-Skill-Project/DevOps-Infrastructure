global: 
  scrape_interval: 10s 
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs: 
      - targets: ['localhost:9090']
  
  - job_name: 'cadvisor'
    static_configs: 
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs: 
      - targets: ['node-exporter:9100']

  - job_name: 'backend' 
    metrics_path: '/api/health' 
    static_configs:
      - targets: ['skillmatch-backend:8000']

  - job_name: 'ai-service' 
    metrics_path: '/health' 
    static_configs:
      - targets: ['skillmatch-ai:8001']
      